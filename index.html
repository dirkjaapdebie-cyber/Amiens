<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚶 Historische wandelingen · 6 steden · 4 thema's + 🚵 MTB</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ---------- ALGEMEEN ---------- */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #1e1e1e; }
        #map { height: 100%; width: 100%; background: #1e2a2a; }

        /* ---------- INLOG ---------- */
        #loginScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,30,25,0.92); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loginScreen.hidden { opacity: 0; pointer-events: none; }
        .login-box {
            background: rgba(255,248,240,0.96); padding: 36px 40px 40px 40px;
            border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 420px; width: 90%; text-align: center;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .login-box h1 { font-size: 28px; color: #1d3b2f; margin: 0 0 4px 0; }
        .login-box .sub { color: #6b6b6b; font-size: 15px; margin-top: 0; margin-bottom: 24px; }
        .login-box label { display: block; text-align: left; font-weight: 600; font-size: 14px; color: #2d3d35; margin-bottom: 4px; }
        .login-box input { width: 100%; padding: 12px 16px; border: 2px solid #ddd6ce; border-radius: 14px; font-size: 17px; background: white; transition: 0.2s; margin-bottom: 18px; }
        .login-box input:focus { outline: none; border-color: #2c5a47; box-shadow: 0 0 0 4px rgba(44,90,71,0.12); }
        .login-box button { width: 100%; padding: 14px; background: #2c5a47; color: white; border: none; border-radius: 40px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.15s ease; box-shadow: 0 4px 12px rgba(44,90,71,0.4); }
        .login-box button:hover { background: #1d4032; transform: scale(0.98); }
        .login-box .gebruikers { margin-top: 14px; font-size: 13px; color: #8a8a8a; }
        .login-box .gebruikers span { background: #eeeae6; padding: 4px 14px; border-radius: 30px; display: inline-block; margin: 4px 4px 0 0; font-weight: 500; color: #2d3d35; }

        /* ---------- PANEEL ---------- */
        .coord-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(30,30,30,0.92); backdrop-filter: blur(12px);
            padding: 14px 16px 16px 16px; border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            min-width: 240px; max-width: 300px;
            border: 1px solid rgba(255,215,0,0.25); color: #eee;
        }
        .coord-panel h3 { margin: 0 0 6px 0; font-size: 14px; color: #f0d080; display: flex; align-items: center; justify-content: space-between; }
        .coord-panel .user-badge { font-size: 13px; color: #ddd; background: #3a3a3a; padding: 2px 14px; border-radius: 30px; font-weight: 600; }
        .coord-panel .stad-selector { width: 100%; padding: 5px 10px; border-radius: 10px; border: 1px solid #555; background: #222; color: #eee; font-size: 13px; font-weight: 600; margin-bottom: 8px; cursor: pointer; }
        .coord-panel .stad-selector:focus { outline: none; border-color: #f0d080; }
        .coord-panel .stad-selector option { background: #222; }

        /* Thema toggles */
        .thema-toggles {
            display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px;
            background: #1a1a1a; padding: 6px 10px; border-radius: 10px;
            border: 1px solid #444;
        }
        .thema-toggles label {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 500; color: #ccc;
            cursor: pointer;
        }
        .thema-toggles input[type="checkbox"] {
            accent-color: #f0d080;
            width: 14px; height: 14px;
            cursor: pointer;
        }

        .coord-actions { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
        .coord-actions button { padding: 6px 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.15s ease; flex: 1; min-width: 60px; }
        .btn-add { background: #2c5a47; color: white; }
        .btn-add:hover { background: #1d4032; }
        .btn-clear { background: #5a4a3a; color: white; }
        .btn-clear:hover { background: #4a3a2a; }
        .btn-logout { background: #b34b2e; color: white; }
        .btn-logout:hover { background: #8a3a22; }
        .btn-stad { background: #3a5a8a; color: white; }
        .btn-stad:hover { background: #2a4a7a; }

        .cache-list { margin-top: 8px; max-height: 70px; overflow-y: auto; border-top: 1px solid #444; padding-top: 5px; font-size: 11px; }
        .cache-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #333; }
        .cache-item .del-btn { background: none; border: none; color: #e67e22; cursor: pointer; font-weight: 700; font-size: 13px; padding: 0 4px; }
        .cache-item .coords-text { font-family: monospace; font-size: 10px; color: #aaa; }
        .no-caches { color: #777; font-size: 11px; text-align: center; padding: 5px 0; }

        .stad-toevoeg { display: none; margin-top: 8px; border-top: 1px solid #444; padding-top: 8px; }
        .stad-toevoeg.show { display: block; }
        .stad-toevoeg input { width: 100%; padding: 4px 8px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; font-size: 12px; margin-bottom: 4px; }
        .stad-toevoeg input:focus { border-color: #f0d080; }

        /* ---------- POP-UP VOOR CACHE TOEVOEGEN ---------- */
        #cachePopup {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 9999;
            align-items: center; justify-content: center;
        }
        #cachePopup .popup-box {
            background: rgba(30,30,30,0.95);
            border-radius: 20px; padding: 30px; max-width: 420px; width: 90%;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        #cachePopup .popup-box h3 {
            color: #f0d080; margin: 0 0 16px 0; text-align: center;
        }
        #cachePopup .popup-box .coord-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        #cachePopup .popup-box .coord-row label {
            font-weight: 600; font-size: 14px; color: #ccc; min-width: 30px;
        }
        #cachePopup .popup-box .coord-row input {
            flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #555;
            background: #222; color: #eee; font-size: 14px;
        }
        #cachePopup .popup-box .coord-row input:focus {
            outline: none; border-color: #f0d080;
        }
        #cachePopup .popup-box .coord-actions {
            display: flex; gap: 8px; margin-top: 16px;
        }
        #cachePopup .popup-box .coord-actions button {
            padding: 12px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s ease;
        }
        #cachePopup .popup-box .coord-actions button.btn-add { flex: 2; background: #2c5a47; color: white; }
        #cachePopup .popup-box .coord-actions button.btn-add:hover { background: #1d4032; }
        #cachePopup .popup-box .coord-actions button.btn-clear { flex: 1; background: #5a4a3a; color: white; }
        #cachePopup .popup-box .coord-actions button.btn-clear:hover { background: #4a3a2a; }

        /* ---------- POPUP MARKER ---------- */
        .popup-container { max-width: 260px; text-align: center; background: rgba(30,30,30,0.95); border-radius: 14px; padding: 6px 6px 8px 6px; color: #eee; border: 1px solid rgba(255,215,0,0.2); }
        .popup-title { font-size: 14px; font-weight: 700; margin: 4px 0 2px 0; color: #f0d080; }
        .popup-sub { font-size: 10px; font-weight: 600; color: white; display: inline-block; padding: 2px 12px; border-radius: 30px; margin-bottom: 4px; }
        .popup-sub.romeins { background: #1d6b4c; }
        .popup-sub.honderd { background: #b34b2e; }
        .popup-sub.woi { background: #5f6b7a; }
        .popup-sub.revolutie { background: #8e44ad; }
        .popup-sub.mtb { background: #e67e22; }
        .popup-sub.groep { background: #2c5a47; }
        .popup-text { font-size: 12px; color: #ccc; text-align: left; margin: 4px 6px 6px 6px; line-height: 1.4; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 10px; }
        .popup-text .audio-btn { background: #f0d080; color: #222; border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 12px; width: 100%; margin-top: 4px; }
        .popup-text .audio-btn:hover { background: #e0c070; }

        /* ---------- LEGENDE ---------- */
        .legende-badge {
            position: absolute; bottom: 100px; left: 20px; z-index: 1000;
            background: rgba(20,20,20,0.9); backdrop-filter: blur(6px);
            padding: 10px 14px 12px 14px; border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-size: 11px; border-left: 6px solid #8e44ad; color: #ddd; font-weight: 500;
            display: flex; flex-wrap: wrap; gap: 4px 12px;
        }
        .legende-badge .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; }
        .legende-badge .dot.romeins { background: #1d6b4c; }
        .legende-badge .dot.honderd { background: #b34b2e; }
        .legende-badge .dot.woi { background: #5f6b7a; }
        .legende-badge .dot.revolutie { background: #8e44ad; }
        .legende-badge .dot.mtb { background: #e67e22; }
        .legende-badge .dot.groep { background: #2c5a47; }

        .locate-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 1000;
            background: #2c5a47; padding: 12px 16px; border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: none;
            font-size: 18px; cursor: pointer; color: white; transition: 0.2s;
            display: flex; align-items: center; gap: 6px; font-weight: 600;
        }
        .locate-btn:hover { background: #1d4032; transform: scale(1.05); }

        @media (max-width: 640px) {
            .coord-panel { top: 10px; left: 10px; right: 10px; min-width: auto; max-width: none; padding: 10px 12px 12px 12px; }
            .coord-actions button { font-size: 10px; padding: 4px 8px; }
            .login-box { padding: 24px 20px 28px 20px; }
            .login-box h1 { font-size: 22px; }
            .legende-badge { bottom: 85px; left: 10px; font-size: 10px; padding: 6px 10px; }
            .locate-btn { bottom: 16px; right: 16px; padding: 8px 12px; font-size: 16px; }
            #cachePopup .popup-box { padding: 20px; }
            #cachePopup .popup-box .coord-row input { font-size: 12px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- INLOGSCHERM -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>🚶 Historische wandelingen</h1>
            <p class="sub">6 steden · 4 thema's + 🚵 MTB · eigen steden toevoegen</p>
            <label for="naamInput">Jouw voornaam</label>
            <input type="text" id="naamInput" placeholder="Bijv. Sophie" autofocus />
            <button onclick="login()">🔓 Start wandelen</button>
            <div class="gebruikers" id="onlineGebruikers">
                <span>👤 Jij</span>
            </div>
        </div>
    </div>

    <!-- KAART -->
    <div id="map"></div>

    <!-- COÖRDINATEN PANEEL (compact) -->
    <div class="coord-panel" id="coordPanel" style="display:none;">
        <h3>
            <span>📍 Groepscache</span>
            <span class="user-badge" id="userBadge">👤</span>
        </h3>
        
        <!-- KNOP om pop-up te openen -->
        <div style="display:flex; gap:4px; margin-bottom:6px;">
            <button class="btn-add" onclick="openCachePopup()" style="flex:1; padding:10px;">📦 Nieuwe cache</button>
            <button class="btn-logout" onclick="logout()" style="flex:0.5;">🚪 Uit</button>
        </div>

        <!-- Stadskeuze -->
        <select class="stad-selector" id="stadSelector" onchange="wisselStad(this.value)"></select>
        
        <!-- Thema toggles -->
        <div class="thema-toggles" id="themaToggles">
            <label><input type="checkbox" id="toggleRomeins" checked onchange="setStippel('romeins', this.checked)" /> Romeins</label>
            <label><input type="checkbox" id="toggleHonderd" checked onchange="setStippel('honderd', this.checked)" /> 100-jarig</label>
            <label><input type="checkbox" id="toggleWOI" checked onchange="setStippel('woi', this.checked)" /> WO I</label>
            <label><input type="checkbox" id="toggleRevolutie" checked onchange="setStippel('revolutie', this.checked)" /> Revolutie</label>
            <label><input type="checkbox" id="toggleMTB" checked onchange="setStippel('mtb', this.checked)" /> 🚵 MTB</label>
        </div>

        <!-- Stad toevoegen -->
        <div style="display:flex; gap:4px; margin-bottom:6px;">
            <button class="btn-stad" onclick="toggleStadToevoeg()" style="flex:1;">➕ Stad toevoegen</button>
        </div>
        <div class="stad-toevoeg" id="stadToevoegForm">
            <input type="text" id="stadNaam" placeholder="Stadsnaam" />
            <div style="display:flex; gap:4px;">
                <input type="text" id="stadLat" placeholder="Lat (bijv. 49.8945)" style="flex:1;" />
                <input type="text" id="stadLng" placeholder="Lng (bijv. 2.2990)" style="flex:1;" />
            </div>
            <input type="number" id="stadZoom" placeholder="Zoom (bijv. 14)" value="14" />
            <div class="coord-actions">
                <button class="btn-add" onclick="voegStadToe()">➕ Toevoegen</button>
                <button class="btn-clear" onclick="toggleStadToevoeg()">Annuleer</button>
            </div>
        </div>

        <!-- CACHE LIJST -->
        <div class="cache-list" id="cacheList">
            <div class="no-caches">📡 Wacht op data...</div>
        </div>
    </div>

    <!-- POP-UP VOOR CACHE TOEVOEGEN -->
    <div id="cachePopup">
        <div class="popup-box">
            <h3>📦 Nieuwe cache toevoegen</h3>
            
            <div class="coord-input-group">
                <div class="coord-row">
                    <label>🌐</label>
                    <input type="text" id="popupLatInput" placeholder="N 50° 02.401 E 002° 07.461" />
                </div>
                <div class="coord-row" style="display:none;">
                    <label>📍</label>
                    <input type="text" id="popupLngInput" placeholder="Lng" />
                </div>
                <div class="coord-row">
                    <label>📝</label>
                    <input type="text" id="popupNameInput" placeholder="Naam (optioneel)" />
                </div>
                <div class="coord-row">
                    <label>📄</label>
                    <input type="text" id="popupDescInput" placeholder="Beschrijving (optioneel)" />
                </div>
            </div>
            
            <div class="coord-actions">
                <button class="btn-add" onclick="voegPopupCacheToe()">➕ Toevoegen</button>
                <button class="btn-clear" onclick="sluitCachePopup()">Annuleer</button>
            </div>
        </div>
    </div>

    <!-- LEGENDE -->
    <div class="legende-badge" id="legende" style="display:none;">
        <span><span class="dot romeins"></span> Romeins</span>
        <span><span class="dot honderd"></span> 100-jarig</span>
        <span><span class="dot woi"></span> WO I</span>
        <span><span class="dot revolutie"></span> Revolutie</span>
        <span><span class="dot mtb"></span> 🚵 MTB</span>
        <span><span class="dot groep"></span> Groepscache</span>
    </div>

    <!-- LOCATIE KNOP -->
    <button class="locate-btn" id="locateBtn" style="display:none;" onclick="centreerOpLocatie()">
        <span>🚶</span> Mijn locatie
    </button>

    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

        // ---------- GLOBALE VARIABELEN ----------

        let userCircle = null;
        let huidigeLatLng = null;

        // ================================================================

        function laadStandaardSteden() {

                                { id: "a_r1", coords: [49.8942, 2.3006], title: "🏛️ Forum & Amfitheater",

                                { id: "a_v3", coords: [49.8925, 2.2990], title: "📜 Marktplein van de Revolutie",

                        mtb: {

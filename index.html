<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amiens Groepsgids & Walkie</title>
    <!-- Leaflet voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PeerJS voor groepswalkie -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <!-- QRCode generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background: #0f172a; color: #e2e8f0; overflow: hidden; }
        
        /* Linkerkant: Kaart */
        #map-container { flex: 2; position: relative; background: #1e293b; }
        #map { width: 100%; height: 100%; }
        .leaflet-popup-content { font-size: 14px; line-height: 1.5; max-width: 300px; color: #0f172a; }
        .leaflet-popup-content h3 { margin-top: 0; color: #b91c1c; }
        .leaflet-popup-content strong { color: #1d4ed8; }

        /* Rechterkant: Walkie Talkie + QR */
        #wt-container { flex: 1; min-width: 350px; padding: 20px; background: #1e293b; display: flex; flex-direction: column; border-left: 2px solid #334155; overflow-y: auto; }
        #wt-container h2 { color: #38bdf8; margin-bottom: 10px; font-size: 20px; }
        
        .qr-area { display: flex; align-items: center; gap: 15px; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        #qrCode { width: 100px; height: 100px; background: #fff; padding: 5px; border-radius: 4px; }
        .id-text { flex: 1; font-size: 13px; word-break: break-all; color: #94a3b8; }
        .id-text span { color: #fbbf24; font-weight: bold; }
        
        #copyBtn { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        #copyBtn:hover { background: #2563eb; }

        .connect-area { display: flex; gap: 10px; margin-bottom: 15px; }
        .connect-area input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .connect-area input:focus { outline: 2px solid #38bdf8; }
        #connectBtn { padding: 8px 16px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #connectBtn:hover { background: #60d5ff; }

        .peer-list { font-size: 13px; color: #94a3b8; margin-bottom: 10px; min-height: 20px; }
        .peer-list .connected { color: #4ade80; }

        /* PTT Knop */
        #pttBtn { width: 100%; padding: 20px; font-size: 22px; background: #ef4444; border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; margin: 10px 0; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); transition: 0.1s; }
        #pttBtn:active { background: #b91c1c; transform: scale(0.96); }
        #pttBtn:disabled { background: #475569; box-shadow: none; }

        /* Chat */
        .chat-area { flex: 1; background: #0f172a; border-radius: 6px; padding: 10px; overflow-y: auto; border: 1px solid #334155; margin: 10px 0; min-height: 80px; max-height: 250px; }
        .chat-area .msg { margin: 4px 0; font-size: 14px; }
        .chat-area .sys { color: #fbbf24; font-style: italic; }
        .chat-area .me { color: #4ade80; }
        .chat-area .other { color: #93c5fd; }

        .chat-input { display: flex; gap: 10px; margin-top: 5px; }
        .chat-input input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .chat-input button { padding: 8px 16px; background: #4ade80; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .chat-input button:disabled { opacity: 0.5; }

        .status { font-size: 13px; color: #94a3b8; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

    <!-- Linkerkant: Kaart -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Rechterkant: Walkie Groep met QR -->
    <div id="wt-container">
        <h2>📻 Groepswalkie (QR)</h2>
        
        <div class="qr-area">
            <div id="qrCode"></div>
            <div class="id-text">
                <div>🔑 <strong>Jouw code</strong> (scan of kopieer):</div>
                <div id="myIdDisplay" style="font-family: monospace; color: #e2e8f0;">Bezig met laden...</div>
                <button id="copyBtn" style="margin-top: 5px;">📋 Kopieer code</button>
            </div>
        </div>

        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">Voeg een groepsgenoot toe (plak de code of scan de QR):</div>
        <div class="connect-area">
            <input type="text" id="remoteIdInput" placeholder="Plak hier de code van de ander">
            <button id="connectBtn">➕ Verbinden</button>
        </div>

        <div class="peer-list" id="peerList">🤝 Nog geen verbindingen...</div>

        <button id="pttBtn" disabled>🎙️ INGEDRUKT HOUDEN OM TE PRATEN</button>

        <div class="chat-area" id="chatArea">
            <div class="msg sys">📡 Start: wacht tot je verbonden bent...</div>
        </div>

        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Typ een groepsbericht..." disabled>
            <button id="sendBtn" disabled>📨 Stuur</button>
        </div>
        <div class="status" id="statusText">⏳ Genereer QR...</div>
    </div>

    <script>
        // --- 1. KAART (LEAFLET) ---
        const map = L.map('map').setView([49.8940, 2.3022], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const marker = L.marker([49.8940, 2.3022]).addTo(map);
        marker.bindPopup(`
            <div style="max-width:280px;">
                <h3>🏛️ Notre Dame van Amiens</h3>
                <p><strong>Adres:</strong> 30 Place Notre Dame, 80000 Amiens</p>
                <hr>
                <h4>Over de crypte:</h4>
                <p>Ja, die is te bezoeken, maar <strong>niet vrij toegankelijk</strong>. De Romaanse crypte (11e eeuw) ligt onder het koor. Alleen via een <strong>rondleiding</strong> (Office de Tourisme).<br>
                <em>Let op:</em> Check de tijden – vaak alleen open in zomermaanden.</p>
                
                <h4>🔎 Bijzonder plekje:</h4>
                <p><strong>het labyrint op de vloer van het schip</strong> (midden in de kerk). Zwart-wit marmeren doolhof, symbool voor de pelgrimstocht. Vraag de kerkwachten om de stoelen even weg te schuiven.</p>
            </div>
        `);
        marker.openPopup();

        // --- 2. GROEPSWALKIE (PEERJS + QR) ---
        let peer = null;
        let localStream = null;
        const connections = new Map(); // peerId -> DataConnection
        let connectedPeers = new Set();
        let myPeerId = '';

        const myIdDisplay = document.getElementById('myIdDisplay');
        const remoteIdInput = document.getElementById('remoteIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const pttBtn = document.getElementById('pttBtn');
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');
        const peerList = document.getElementById('peerList');
        const copyBtn = document.getElementById('copyBtn');

        function addChat(text, type = 'sys') {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function updatePeerList() {
            const count = connectedPeers.size;
            if (count === 0) {
                peerList.innerHTML = '🤝 Nog geen verbindingen...';
            } else {
                peerList.innerHTML = `✅ Verbonden met <span class="connected">${count}</span> groepsleden: ${Array.from(connectedPeers).join(', ')}`;
            }
            const enabled = count > 0 && localStream !== null;
            pttBtn.disabled = !enabled;
            chatInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                statusText.textContent = `🟢 Verbonden met ${count} groepsleden (audio klaar)`;
                pttBtn.style.background = '#ef4444';
            } else {
                statusText.textContent = count > 0 ? '⛔ Wacht op microfoon...' : '⛔ Nog geen verbindingen';
                pttBtn.style.background = '#475569';
            }
        }

        // Microfoon init
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                updatePeerList();
            })
            .catch(err => {
                addChat(`❌ Geen microfoon: ${err.message}`, 'sys');
                statusText.textContent = '⚠️ Geen audio zonder microfoon.';
            });

        // Peer init + QR
        function initPeer() {
            peer = new Peer(null, {
                debug: 2,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                myIdDisplay.textContent = id;
                // Genereer QR-code
                new QRCode(document.getElementById("qrCode"), {
                    text: id,
                    width: 100,
                    height: 100,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                statusText.textContent = '✅ QR-code gereed. Deel via scan of kopieer.';
                addChat(`🔑 Jouw ID is gegenereerd`, 'sys');
            });

            // Inkomende data
            peer.on('connection', (conn) => {
                const remoteId = conn.peer;
                if (connectedPeers.has(remoteId)) {
                    conn.close();
                    return;
                }
                connectedPeers.add(remoteId);
                connections.set(remoteId, conn);
                conn.on('data', (data) => addChat(`📨 Ander: ${data}`, 'other'));
                conn.on('open', () => {
                    addChat(`🔗 ${remoteId} heeft verbinding gemaakt`, 'sys');
                    updatePeerList();
                });
                conn.on('close', () => {
                    connectedPeers.delete(remoteId);
                    connections.delete(remoteId);
                    addChat(`🔌 ${remoteId} is verbroken`, 'sys');
                    updatePeerList();
                });
            });

            // Inkomende audio
            peer.on('call', (call) => {
                if (!localStream) return call.close();
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                    addChat(`🎧 Audio van ${call.peer} actief`, 'sys');
                });
                call.on('close', () => addChat(`📴 Audio van ${call.peer} beëindigd`, 'sys'));
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    initPeer();
                } else {
                    addChat(`⚠️ Fout: ${err.message}`, 'sys');
                }
            });
        }
        initPeer();

        // Verbinden met één persoon (via QR of geplakte code)
        connectBtn.onclick = () => {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) { addChat('❌ Plak eerst een code.', 'sys'); return; }
            if (remoteId === myPeerId) { addChat('❌ Je kunt niet met jezelf verbinden.', 'sys'); return; }
            if (connectedPeers.has(remoteId)) { addChat(`ℹ️ Al verbonden met ${remoteId}`, 'sys'); return; }

            addChat(`⏳ Verbinden met ${remoteId}...`, 'sys');

            // Data connectie
            const conn = peer.connect(remoteId, { reliable: true });
            conn.on('open', () => {
                connectedPeers.add(remoteId);
                connections.set(remoteId, conn);
                addChat(`🔗 Verbonden met ${remoteId}`, 'sys');
                updatePeerList();
            });
            conn.on('data', (data) => addChat(`📨 Ander: ${data}`, 'other'));
            conn.on('close', () => {
                connectedPeers.delete(remoteId);
                connections.delete(remoteId);
                addChat(`🔌 Verbinding met ${remoteId} verbroken`, 'sys');
                updatePeerList();
            });

            // Audio call
            if (localStream) {
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                    addChat(`🎧 Audio met ${remoteId} actief`, 'sys');
                });
                call.on('close', () => addChat(`📴 Audio met ${remoteId} beëindigd`, 'sys'));
            }

            remoteIdInput.value = '';
        };

        // Copy naar klembord
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(myPeerId).then(() => {
                addChat('✅ Code gekopieerd naar klembord!', 'sys');
            }).catch(() => {
                addChat('⚠️ Kon niet kopiëren, selecteer handmatig.', 'sys');
            });
        };

        // Push-to-talk (groep)
        pttBtn.addEventListener('mousedown', () => {
            if (!localStream || connectedPeers.size === 0) return;
            localStream.getAudioTracks()[0].enabled = true;
            pttBtn.textContent = '🔴 AAN HET PRATEN...';
        });
        pttBtn.addEventListener('mouseup', () => {
            if (localStream) localStream.getAudioTracks()[0].enabled = false;
            pttBtn.textContent = '🎙️ INGEDRUKT HOUDEN OM TE PRATEN';
        });
        pttBtn.addEventListener('mouseleave', () => {
            if (localStream) localStream.getAudioTracks()[0].enabled = false;
            pttBtn.textContent = '🎙️ INGEDRUKT HOUDEN OM TE PRATEN';
        });

        // Groepsbericht
        sendBtn.onclick = () => {
            const msg = chatInput.value.trim();
            if (!msg || connectedPeers.size === 0) return;
            connections.forEach((conn) => conn.send(msg));
            addChat(`👤 Jij: ${msg}`, 'me');
            chatInput.value = '';
        };
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>

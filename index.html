<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🚶 Historische wandelingen · Walkie-Talkie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        /* ---------- RESET & BASIS ---------- */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d0d; }
        #map { height: 100%; width: 100%; background: #1a1a1a; }

        /* ---------- INLOG ---------- */
        #loginScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,10,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loginScreen.hidden { opacity: 0; pointer-events: none; }
        .login-box {
            background: rgba(30,30,30,0.96); backdrop-filter: blur(12px);
            padding: 32px 30px; border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            max-width: 420px; width: 90%; text-align: center;
            border: 1px solid rgba(255,215,0,0.2);
            color: #eee;
        }
        .login-box h1 { font-size: 26px; margin: 0 0 4px; color: #f0d080; }
        .login-box .sub { font-size: 14px; color: #999; margin-bottom: 20px; }
        .login-box label { display: block; text-align: left; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #bbb; }
        .login-box input, .login-box select {
            width: 100%; padding: 12px 14px; border: 1px solid #444;
            border-radius: 14px; font-size: 16px; background: #1a1a1a; color: #eee;
            margin-bottom: 14px; transition: 0.2s;
        }
        .login-box input:focus, .login-box select:focus { border-color: #f0d080; outline: none; box-shadow: 0 0 0 4px rgba(240,208,128,0.15); }
        .login-box button {
            width: 100%; padding: 14px; background: #2c5a47; color: white; border: none;
            border-radius: 40px; font-size: 18px; font-weight: 700; cursor: pointer;
            transition: 0.2s ease; box-shadow: 0 4px 16px rgba(44,90,71,0.3);
        }
        .login-box button:hover { background: #1d4032; transform: scale(0.98); }
        .login-box .gebruikers { font-size: 13px; color: #888; margin-top: 12px; }
        .login-box .gebruikers span { background: #2a2a2a; padding: 4px 14px; border-radius: 30px; display: inline-block; margin: 4px 4px 0 0; color: #ddd; }

        /* ---------- COORDINATEN PANEEL ---------- */
        .coord-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(20,20,20,0.92); backdrop-filter: blur(12px);
            padding: 16px; border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            min-width: 260px; max-width: 320px;
            border: 1px solid rgba(255,215,0,0.15); color: #eee;
            transition: all 0.2s;
        }
        .coord-panel h3 { margin: 0 0 8px; font-size: 15px; color: #f0d080; display: flex; align-items: center; justify-content: space-between; }
        .coord-panel .user-badge { font-size: 13px; background: #2a2a2a; padding: 2px 14px; border-radius: 30px; font-weight: 600; }
        .coord-panel .stad-selector {
            width: 100%; padding: 6px 10px; border-radius: 10px; border: 1px solid #444;
            background: #1a1a1a; color: #eee; font-size: 13px; font-weight: 600;
            margin-bottom: 10px; cursor: pointer;
        }
        .coord-panel .stad-selector:focus { border-color: #f0d080; }
        .coord-panel .stad-selector option { background: #1a1a1a; }

        /* Thema toggles */
        .thema-toggles {
            display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px;
            background: #1a1a1a; padding: 6px 10px; border-radius: 10px;
            border: 1px solid #333;
        }
        .thema-toggles label {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 500; color: #ccc; cursor: pointer;
        }
        .thema-toggles input[type="checkbox"] { accent-color: #f0d080; width: 14px; height: 14px; cursor: pointer; }

        .coord-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .coord-actions button {
            padding: 8px 14px; border: none; border-radius: 30px; font-weight: 600;
            font-size: 12px; cursor: pointer; transition: 0.15s ease; flex: 1; min-width: 60px;
        }
        .btn-add { background: #2c5a47; color: white; }
        .btn-add:hover { background: #1d4032; }
        .btn-clear { background: #5a4a3a; color: white; }
        .btn-clear:hover { background: #4a3a2a; }
        .btn-logout { background: #b34b2e; color: white; }
        .btn-logout:hover { background: #8a3a22; }
        .btn-stad { background: #3a5a8a; color: white; }
        .btn-stad:hover { background: #2a4a7a; }

        /* Cache lijst */
        .cache-list { margin-top: 8px; max-height: 80px; overflow-y: auto; border-top: 1px solid #333; padding-top: 6px; font-size: 12px; }
        .cache-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid #2a2a2a; }
        .cache-item .del-btn { background: none; border: none; color: #e67e22; cursor: pointer; font-weight: 700; font-size: 14px; padding: 0 4px; }
        .cache-item .coords-text { font-family: monospace; font-size: 10px; color: #888; }
        .no-caches { color: #777; font-size: 11px; text-align: center; padding: 6px 0; }

        /* Stad toevoegen */
        .stad-toevoeg { display: none; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
        .stad-toevoeg.show { display: block; }
        .stad-toevoeg input {
            width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid #444;
            background: #1a1a1a; color: #eee; font-size: 13px; margin-bottom: 4px;
        }
        .stad-toevoeg input:focus { border-color: #f0d080; }

        /* Upload routes */
        #uploadedRoutesContainer { transition: all 0.2s; }
        #uploadedRoutesContainer.open { display: block !important; }
        .upload-route-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2px 0; border-bottom: 1px solid #333;
        }
        .upload-route-item label {
            display: flex; align-items: center; gap: 4px; font-size: 11px; color: #ccc; cursor: pointer;
        }
        .upload-route-item input[type="checkbox"] { accent-color: #e74c3c; width: 12px; height: 12px; }
        .upload-route-item .del-btn { background:none; border:none; color:#e67e22; cursor:pointer; font-weight:700; font-size:12px; padding:0 4px; }

        /* ---------- CACHE POPUP ---------- */
        #cachePopup {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            z-index: 9998;
            align-items: center; justify-content: center;
        }
        #cachePopup .popup-box {
            background: rgba(30,30,30,0.95); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 28px; max-width: 440px; width: 90%;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            color: #eee;
        }
        #cachePopup .popup-box h3 { color: #f0d080; margin: 0 0 16px; text-align: center; }
        #cachePopup .popup-box .coord-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        #cachePopup .popup-box .coord-row label {
            font-weight: 600; font-size: 14px; color: #ccc; min-width: 40px;
        }
        #cachePopup .popup-box .coord-row input {
            flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #444;
            background: #1a1a1a; color: #eee; font-size: 14px; transition: 0.2s;
        }
        #cachePopup .popup-box .coord-row input:focus { outline: none; border-color: #f0d080; }
        #cachePopup .popup-box .coord-actions {
            display: flex; gap: 8px; margin-top: 16px;
        }
        #cachePopup .popup-box .coord-actions button {
            padding: 12px; border: none; border-radius: 40px;
            font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s ease;
        }
        #cachePopup .popup-box .coord-actions button.btn-add { flex: 2; background: #2c5a47; color: white; }
        #cachePopup .popup-box .coord-actions button.btn-add:hover { background: #1d4032; }
        #cachePopup .popup-box .coord-actions button.btn-clear { flex: 1; background: #5a4a3a; color: white; }
        #cachePopup .popup-box .coord-actions button.btn-clear:hover { background: #4a3a2a; }
        #cachePopup .popup-box .coord-actions button.btn-map { flex: 1; background: #4a6a8a; color: white; }
        #cachePopup .popup-box .coord-actions button.btn-map:hover { background: #3a5a7a; }

        /* ---------- WALKIE-TALKIE MODAL ---------- */
        #wtModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            z-index: 9997;
            align-items: center; justify-content: center;
        }
        #wtModal .wt-box {
            background: rgba(20,20,20,0.95); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 20px; max-width: 480px; width: 90%;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            color: #eee;
            max-height: 90vh; overflow-y: auto;
        }
        #wtModal .wt-box h3 { color: #f0d080; margin: 0 0 12px; text-align: center; }
        .wt-status-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; color: #aaa; padding: 4px 0;
        }
        .wt-status-led {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%;
            margin-right: 6px; vertical-align: middle;
        }
        .wt-status-led.online { background: #28a745; animation: pulse 1.5s infinite; }
        .wt-status-led.offline { background: #dc3545; animation: none; }
        .wt-status-led.connecting { background: #f0c040; animation: pulse 0.5s infinite; }
        .wt-status-led.speaking { background: #f0c040; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .wt-user-chips {
            display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0;
        }
        .wt-user-chip {
            background: #2a2a2a; padding: 2px 10px 2px 6px; border-radius: 14px;
            font-size: 12px; display: inline-flex; align-items: center; gap: 4px;
            border: 1px solid #444;
        }
        .wt-user-chip.self { border-color: #f0c040; }

        .ptt-btn {
            width: 100%; padding: 16px; border: none; border-radius: 20px;
            font-weight: 700; font-size: 18px; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
            background: #dc3545; color: white; margin: 8px 0;
        }
        .ptt-btn:active, .ptt-btn.active { background: #f0c040; color: #1a1a1a; transform: scale(0.97); }
        .ptt-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .wt-chat-box {
            max-height: 120px; overflow-y: auto; font-size: 13px;
            background: #0a0a0a; border-radius: 12px; padding: 6px 8px;
            margin: 8px 0; border: 1px solid #333;
        }
        .wt-chat-box .msg { padding: 2px 4px; border-bottom: 1px solid #1a1a1a; }
        .wt-chat-box .msg .sender { font-weight: 600; color: #88ccff; }
        .wt-chat-box .msg .time { color: #667788; font-size: 10px; margin-left: 6px; }

        .wt-input-row {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .wt-input-row input {
            flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid #444;
            background: #0a0a0a; color: #eee; font-size: 14px;
        }
        .wt-input-row input:focus { border-color: #f0c040; outline: none; }
        .wt-input-row button {
            padding: 8px 16px; border: none; border-radius: 10px;
            background: #4a90d9; color: white; font-weight: 600; cursor: pointer;
        }
        .wt-input-row button:hover { background: #357abd; }
        .wt-close-btn {
            position: absolute; top: 10px; right: 16px;
            background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer;
        }
        .wt-close-btn:hover { color: #fff; }

        /* ---------- WALKIE KNOP (zwevend) ---------- */
        #wtToggleBtn {
            position: absolute; bottom: 30px; right: 30px; z-index: 1001;
            background: #2c5a47; padding: 16px 20px; border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: none;
            font-size: 24px; cursor: pointer; color: white; transition: 0.2s;
            display: flex; align-items: center; gap: 6px; font-weight: 600;
        }
        #wtToggleBtn:hover { background: #1d4032; transform: scale(1.05); }
        #wtToggleBtn .badge {
            background: #dc3545; border-radius: 50%; padding: 2px 8px;
            font-size: 12px; font-weight: 700; color: white;
        }

        /* ---------- LEGENDE ---------- */
        .legende-badge {
            position: absolute; bottom: 100px; left: 20px; z-index: 1000;
            background: rgba(20,20,20,0.9); backdrop-filter: blur(6px);
            padding: 10px 14px; border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-size: 11px; border-left: 6px solid #8e44ad; color: #ddd;
            display: flex; flex-wrap: wrap; gap: 4px 12px;
        }
        .legende-badge .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; }
        .legende-badge .dot.romeins { background: #1d6b4c; }
        .legende-badge .dot.honderd { background: #b34b2e; }
        .legende-badge .dot.woi { background: #5f6b7a; }
        .legende-badge .dot.revolutie { background: #8e44ad; }
        .legende-badge .dot.groep { background: #2c5a47; }
        .legende-badge .dot.kml { background: #e74c3c; }

        /* ---------- LOCATIE KNOP ---------- */
        #locateBtn {
            position: absolute; bottom: 30px; left: 30px; z-index: 1000;
            background: #2c5a47; padding: 12px 16px; border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: none;
            font-size: 18px; cursor: pointer; color: white; transition: 0.2s;
            display: none; align-items: center; gap: 6px; font-weight: 600;
        }
        #locateBtn:hover { background: #1d4032; transform: scale(1.05); }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .coord-panel { top: 10px; left: 10px; right: 10px; min-width: auto; max-width: none; padding: 12px; }
            .coord-actions button { font-size: 11px; padding: 6px 10px; }
            .login-box { padding: 24px 20px; }
            .login-box h1 { font-size: 22px; }
            .legende-badge { bottom: 85px; left: 10px; font-size: 10px; padding: 6px 10px; }
            #locateBtn { bottom: 16px; left: 16px; padding: 8px 12px; font-size: 16px; }
            #wtToggleBtn { bottom: 16px; right: 16px; padding: 12px 16px; font-size: 20px; }
            #wtModal .wt-box { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- INLOGSCHERM -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>🚶 Historische wandelingen</h1>
            <p class="sub">6 steden · 4 thema's · eigen steden toevoegen</p>
            <label for="naamInput">Jouw voornaam</label>
            <input type="text" id="naamInput" placeholder="Bijv. Sophie" autofocus />
            <label for="rolSelect">Rol</label>
            <select id="rolSelect">
                <option value="deelnemer">👤 Deelnemer</option>
                <option value="leider">👑 Leider (hub)</option>
            </select>
            <button onclick="login()">🔓 Start wandelen</button>
            <div class="gebruikers" id="onlineGebruikers">
                <span>👤 Jij</span>
            </div>
        </div>
    </div>

    <!-- KAART -->
    <div id="map"></div>

    <!-- COÖRDINATEN PANEEL -->
    <div class="coord-panel" id="coordPanel" style="display:none;">
        <h3>
            <span>📍 Groepscache</span>
            <span class="user-badge" id="userBadge">👤</span>
        </h3>

        <div style="display:flex; gap:6px; margin-bottom:8px;">
            <button class="btn-add" onclick="openCachePopup()" style="flex:1; padding:10px;">📦 Nieuwe cache</button>
            <button class="btn-logout" onclick="logout()" style="flex:0.5;">🚪 Uit</button>
        </div>

        <!-- Stadskeuze -->
        <select class="stad-selector" id="stadSelector" onchange="wisselStad(this.value)"></select>

        <!-- Upload routes -->
        <div style="margin:6px 0 4px;">
            <input type="file" id="routeUpload" accept=".gpx,.kml,.csv" style="display:none;" onchange="verwerkUpload(event)" />
            <button class="btn-stad" onclick="document.getElementById('routeUpload').click()" style="width:100%; padding:8px;">
                📤 Upload route (GPX/KML/CSV)
            </button>
        </div>

        <!-- Uitklapmenu geüploade routes -->
        <div style="margin-top:4px; border-top:1px solid #333;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; cursor:pointer;" onclick="toggleRouteMenu()">
                <span style="font-size:12px; font-weight:600; color:#ccc;">📂 Geüploade routes</span>
                <span id="routeMenuToggle" style="font-size:12px; color:#888;">▶</span>
            </div>
            <div id="uploadedRoutesContainer" style="display:none; padding:4px 0; max-height:120px; overflow-y:auto;">
                <div id="uploadedRoutesList">
                    <div class="no-caches">Geen routes geüpload</div>
                </div>
            </div>
        </div>

        <!-- KML Track toggle -->
        <div style="display:flex; gap:8px; margin-bottom:8px; background:#1a1a1a; padding:4px 8px; border-radius:8px; border:1px solid #333;">
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; font-weight:500; color:#ccc; cursor:pointer;">
                <input type="checkbox" id="toggleKML" checked onchange="toggleKMLTrack(this.checked)" />
                🚵 Abbeville KML-track
            </label>
        </div>

        <!-- Thema toggles -->
        <div class="thema-toggles" id="themaToggles">
            <label><input type="checkbox" id="toggleRomeins" checked onchange="setStippel('romeins', this.checked)" /> Romeins</label>
            <label><input type="checkbox" id="toggleHonderd" checked onchange="setStippel('honderd', this.checked)" /> 100-jarig</label>
            <label><input type="checkbox" id="toggleWOI" checked onchange="setStippel('woi', this.checked)" /> WO I</label>
            <label><input type="checkbox" id="toggleRevolutie" checked onchange="setStippel('revolutie', this.checked)" /> Revolutie</label>
        </div>

        <!-- Stad toevoegen -->
        <div style="display:flex; gap:4px; margin-bottom:6px;">
            <button class="btn-stad" onclick="toggleStadToevoeg()" style="flex:1;">➕ Stad toevoegen</button>
        </div>
        <div class="stad-toevoeg" id="stadToevoegForm">
            <input type="text" id="stadNaam" placeholder="Stadsnaam" />
            <div style="display:flex; gap:4px;">
                <input type="text" id="stadLat" placeholder="Lat (bijv. 49.8945)" style="flex:1;" />
                <input type="text" id="stadLng" placeholder="Lng (bijv. 2.2990)" style="flex:1;" />
            </div>
            <input type="number" id="stadZoom" placeholder="Zoom (bijv. 14)" value="14" />
            <div class="coord-actions">
                <button class="btn-add" onclick="voegStadToe()">➕ Toevoegen</button>
                <button class="btn-clear" onclick="toggleStadToevoeg()">Annuleer</button>
            </div>
        </div>

        <!-- CACHE LIJST -->
        <div class="cache-list" id="cacheList">
            <div class="no-caches">📡 Wacht op data...</div>
        </div>
    </div>

    <!-- POP-UP VOOR CACHE TOEVOEGEN -->
    <div id="cachePopup">
        <div class="popup-box">
            <h3>📦 Nieuwe cache toevoegen</h3>
            <div class="coord-row">
                <label>🌐 Lat</label>
                <input type="text" id="popupLatInput" placeholder="Bijv. 50.1050" />
            </div>
            <div class="coord-row">
                <label>🌐 Lng</label>
                <input type="text" id="popupLngInput" placeholder="Bijv. 1.8330" />
            </div>
            <div class="coord-row">
                <label>📝 Naam</label>
                <input type="text" id="popupNameInput" placeholder="Naam (optioneel)" />
            </div>
            <div class="coord-row">
                <label>📄 Beschrijving</label>
                <input type="text" id="popupDescInput" placeholder="Beschrijving (optioneel)" />
            </div>
            <div class="coord-actions">
                <button class="btn-add" onclick="voegPopupCacheToe()">➕ Toevoegen</button>
                <button class="btn-map" onclick="kiesOpKaart()">📍 Kies op kaart</button>
                <button class="btn-clear" onclick="sluitCachePopup()">Annuleer</button>
            </div>
        </div>
    </div>

    <!-- WALKIE-TALKIE MODAL -->
    <div id="wtModal">
        <div class="wt-box" style="position:relative;">
            <button class="wt-close-btn" onclick="sluitWtModal()">✕</button>
            <h3>📻 Walkie-Talkie</h3>
            <div class="wt-status-row">
                <span><span class="wt-status-led offline" id="wtStatusLed"></span><span id="wtStatusText">Niet verbonden</span></span>
                <span id="wtPeerId" style="font-size:11px; color:#667788;">ID: -</span>
                <span id="wtUserCount" style="font-size:13px;">👥 0</span>
            </div>
            <div class="wt-user-chips" id="wtUserList">
                <span style="color:#667788;font-size:12px;">Geen gebruikers</span>
            </div>
            <button class="ptt-btn" id="pttButton" disabled>🎤 HOU IN</button>
            <div class="wt-chat-box" id="wtChatMessages"></div>
            <div class="wt-input-row">
                <input type="text" id="wtChatInput" placeholder="Typ een bericht..." disabled />
                <button id="wtChatSendBtn" disabled>📨</button>
            </div>
            <button class="btn btn-danger" id="wtDisconnectBtn" style="margin-top:8px; padding:8px; font-size:13px; border:none; border-radius:40px; background:#b34b2e; color:white; width:100%; cursor:pointer;">🚪 Verbinding verbreken</button>

        // ============================================================
        // WALKIE-TALKIE (PEERJS) - GLOBAL VARIABELEN
        // ============================================================
        let peer = null;
        let localStream = null;
        let isSpeaking = false;
        let connections = [];
        let remoteStreams = new Map();
        let isConnected = false;
        let isLeider = false;
        const WT_HUB_ID = 'WALKING_HUB';

        // DOM refs walkie
        const wtModal = document.getElementById('wtModal');
        const wtToggleBtn = document.getElementById('wtToggleBtn');
        const wtStatusLed = document.getElementById('wtStatusLed');
        const wtStatusText = document.getElementById('wtStatusText');
        const wtPeerId = document.getElementById('wtPeerId');
        const wtUserCount = document.getElementById('wtUserCount');
        const wtUserList = document.getElementById('wtUserList');
        const pttButton = document.getElementById('pttButton');
        const wtChatMessages = document.getElementById('wtChatMessages');
        const wtChatInput = document.getElementById('wtChatInput');
        const wtChatSendBtn = document.getElementById('wtChatSendBtn');
        const wtDisconnectBtn = document.getElementById('wtDisconnectBtn');
        const wtBadge = document.getElementById('wtBadge');

        // ============================================================
        // APPLICATIE LOGICA
        // ============================================================

        function initMap() {
            map = L.map('map').setView([steden[huidigeStad].lat, steden[huidigeStad].lng], steden[huidigeStad].zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            vulStadSelector();
            tekenKMLTrack();
            tekenPOIs(); // Voeg bezienswaardigheden toe
            luisterNaarFirebase();
        }

        // ----- POI (Bezienswaardigheden) -----
        let poiMarkers = [];

        function tekenPOIs() {
            // Verwijder oude POI-markers
            poiMarkers.forEach(m => map.removeLayer(m));
            poiMarkers = [];

            // Filter op huidige stad
            const stadPOIs = poiData.filter(p => p.stad === huidigeStad);

            stadPOIs.forEach(p => {
                // Controleer of thema is ingeschakeld
                if (!stippelStatus[p.thema]) return;

                let kleur;
                switch(p.thema) {
                    case 'romeins': kleur = '#1d6b4c'; break;
                    case 'honderd': kleur = '#b34b2e'; break;
                    case 'woi': kleur = '#5f6b7a'; break;
                    case 'revolutie': kleur = '#8e44ad'; break;
                    default: kleur = '#888';
                }

                const marker = L.circleMarker([p.lat, p.lng], {
                    color: kleur,
                    fillColor: kleur,
                    fillOpacity: 0.7,
                    radius: 7
                }).addTo(map);

                marker.bindPopup(`
                    <div class="popup-container">
                        <div class="popup-title">${p.naam}</div>
                        <div class="popup-sub ${p.thema}">${p.thema}</div>
                        <div class="popup-text">${p.beschrijving}</div>
                    </div>
                `);
                poiMarkers.push(marker);
            });
        }

        // ----- KML & THEMA -----
        function tekenKMLTrack() {
            if (kmlLayer) map.removeLayer(kmlLayer);
            if (kmlCoordinaten && kmlCoordinaten.length > 0) {
                kmlLayer = L.polyline(kmlCoordinaten, { color: '#e74c3c', weight: 4, opacity: 0.8 });
                if (kmlZichtbaar) kmlLayer.addTo(map);
            }
        }

        function toggleKMLTrack(checked) {
            kmlZichtbaar = checked;
            if (kmlLayer) {
                if (kmlZichtbaar) map.addLayer(kmlLayer);
                else map.removeLayer(kmlLayer);
            }
        }

        function setStippel(thema, checked) {
            stippelStatus[thema] = checked;
            tekenPOIs(); // ververs de POI-markers
        }

        // ----- Overige functies (stad, cache, upload, etc.) -----
        function vulStadSelector() {
            const sel = document.getElementById('stadSelector');
            sel.innerHTML = '';
            for (let key in steden) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = steden[key].naam;
                if (key === huidigeStad) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        function login() {
            const naam = document.getElementById('naamInput').value.trim();
            if (!naam) return alert("Vul a.u.b. een naam in!");
            const rolSelect = document.getElementById('rolSelect');
            rol = rolSelect.value;
            huidigeGebruiker = naam;
            isLeider = (rol === 'leider');

            document.getElementById('userBadge').innerText = "👤 " + huidigeGebruiker + (isLeider ? " 👑" : "");
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('coordPanel').style.display = 'block';
            document.getElementById('legende').style.display = 'flex';
            document.getElementById('locateBtn').style.display = 'flex';
            document.getElementById('wtToggleBtn').style.display = 'flex';

            if (!map) initMap();
            startLocatieTracking();
            initWalkieTalkie(); // Start PeerJS
        }

        function logout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('coordPanel').style.display = 'none';
            document.getElementById('legende').style.display = 'none';
            document.getElementById('locateBtn').style.display = 'none';
            document.getElementById('wtToggleBtn').style.display = 'none';
            if (peer) { peer.destroy(); peer = null; }
            connections = [];
            remoteStreams.clear();
            isConnected = false;
        }

        function wisselStad(stadKey) {
            if (steden[stadKey]) {
                huidigeStad = stadKey;
                map.setView([steden[stadKey].lat, steden[stadKey].lng], steden[stadKey].zoom);
                tekenPOIs(); // toon POI's van de nieuwe stad
            }
        }

        function toggleStadToevoeg() {
            const form = document.getElementById('stadToevoegForm');
            form.classList.toggle('show');
        }

        function voegStadToe() {
            const naam = document.getElementById('stadNaam').value.trim();
            const lat = parseFloat(document.getElementById('stadLat').value);
            const lng = parseFloat(document.getElementById('stadLng').value);
            const zoom = parseInt(document.getElementById('stadZoom').value) || 14;

            if (naam && !isNaN(lat) && !isNaN(lng)) {
                const key = naam.toLowerCase().replace(/\s+/g, '_');
                steden[key] = { naam, lat, lng, zoom };
                vulStadSelector();
                wisselStad(key);
                toggleStadToevoeg();
                document.getElementById('stadNaam').value = '';
                document.getElementById('stadLat').value = '';
                document.getElementById('stadLng').value = '';
            } else {
                alert("Vul een geldige stadsnaam en coördinaten in.");
            }
        }

        // ----- CACHE POPUP -----
        function openCachePopup() {
            document.getElementById('cachePopup').style.display = 'flex';
        }

        function sluitCachePopup() {
            document.getElementById('cachePopup').style.display = 'none';
            if (map) map.off('click', handleMapClick);
        }

        function voegPopupCacheToe() {
            const lat = parseFloat(document.getElementById('popupLatInput').value.trim());
            const lng = parseFloat(document.getElementById('popupLngInput').value.trim());
            const name = document.getElementById('popupNameInput').value.trim() || 'Groepscache';
            const desc = document.getElementById('popupDescInput').value.trim() || '';

            if (!isNaN(lat) && !isNaN(lng)) {
                const newCacheRef = database.ref('caches').push();
                newCacheRef.set({
                    lat: lat,
                    lng: lng,
                    naam: name,
                    beschrijving: desc,
                    maker: huidigeGebruiker,
                    timestamp: Date.now()
                });
                sluitCachePopup();
                document.getElementById('popupLatInput').value = '';
                document.getElementById('popupLngInput').value = '';
                document.getElementById('popupNameInput').value = '';
                document.getElementById('popupDescInput').value = '';
            } else {
                alert("Voer geldige coördinaten in (decimaal).");
            }
        }

        function kiesOpKaart() {
            sluitCachePopup();
            map.once('click', handleMapClick);
            alert("Klik op de kaart om de locatie te kiezen.");
        }

        function handleMapClick(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            openCachePopup();
            document.getElementById('popupLatInput').value = lat.toFixed(6);
            document.getElementById('popupLngInput').value = lng.toFixed(6);
        }

        function meenemenCacheVerwijderen(key) {
            if (confirm("Verwijder deze cache?")) {
                database.ref('caches/' + key).remove();
            }
        }

        function luisterNaarFirebase() {
            database.ref('caches').on('value', (snapshot) => {
                groepsCaches = snapshot.val() || {};
                updateCacheLijstEnMarkers();
            });
        }

        function updateCacheLijstEnMarkers() {
            const listDiv = document.getElementById('cacheList');
            listDiv.innerHTML = '';

            for (let k in alleMarkers) {
                if (alleMarkers[k].isGroep) {
                    map.removeLayer(alleMarkers[k]);
                    delete alleMarkers[k];
                }
            }

            const keys = Object.keys(groepsCaches);
            if (keys.length === 0) {
                listDiv.innerHTML = '<div class="no-caches">Geen groepscaches aanwezig</div>';
                return;
            }

            keys.forEach(k => {
                const c = groepsCaches[k];
                const item = document.createElement('div');
                item.className = 'cache-item';
                item.innerHTML = `
                    <div>
                        <strong>${c.naam}</strong> (${c.maker || 'Anoniem'})<br>
                        <span class="coords-text">${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}</span>
                    </div>
                    <button class="del-btn" onclick="meenemenCacheVerwijderen('${k}')">🗑️</button>
                `;
                listDiv.appendChild(item);

                const marker = L.circleMarker([c.lat, c.lng], {
                    color: '#2c5a47',
                    fillColor: '#2c5a47',
                    fillOpacity: 0.8,
                    radius: 8
                }).addTo(map);

                marker.bindPopup(`
                    <div class="popup-container">
                        <div class="popup-title">${c.naam}</div>
                        <div class="popup-sub groep">Groepscache</div>
                        <div class="popup-text">${c.beschrijving || 'Geen beschrijving'}<br><em>Door: ${c.maker || 'Onbekend'}</em></div>
                    </div>
                `);
                marker.isGroep = true;
                alleMarkers[k] = marker;
            });
        }

        function toggleRouteMenu() {
            const container = document.getElementById('uploadedRoutesContainer');
            const toggleIcon = document.getElementById('routeMenuToggle');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                toggleIcon.innerText = '▼';
            } else {
                container.style.display = 'none';
                toggleIcon.innerText = '▶';
            }
        }

        function verwerkUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const list = document.getElementById('uploadedRoutesList');
                if (list.querySelector('.no-caches')) list.innerHTML = '';

                const item = document.createElement('div');
                item.className = 'upload-route-item';
                item.innerHTML = `
                    <label><input type="checkbox" checked /> ${file.name}</label>
                    <button class="del-btn" onclick="this.parentElement.remove()">🗑️</button>
                `;
                list.appendChild(item);
            };
            reader.readAsText(file);
        }

        // ----- LOCATIE TRACKING -----
        function startLocatieTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    huidigeLatLng = [pos.coords.latitude, pos.coords.longitude];
                    if (!userMarker) {
                        userMarker = L.marker(huidigeLatLng).addTo(map).bindPopup("Jij bent hier!");
                        userCircle = L.circle(huidigeLatLng, { radius: GEOFENCE_STRAAL, color: '#3388ff', fillOpacity: 0.15 }).addTo(map);
                    } else {
                        userMarker.setLatLng(huidigeLatLng);
                        userCircle.setLatLng(huidigeLatLng);
                    }
                }, (err) => {
                    console.warn("Geolocatie fout:", err);
                }, { enableHighAccuracy: true });
            }
        }

        function centreerOpLocatie() {
            if (huidigeLatLng) {
                map.setView(huidigeLatLng, 16);
            } else {
                alert("Locatie wordt geladen...");
            }
        }

        // ============================================================
        // WALKIE-TALKIE IMPLEMENTATIE
        // ============================================================

        function openWtModal() {
            wtModal.style.display = 'flex';
        }

        function sluitWtModal() {
            wtModal.style.display = 'none';
        }

        wtModal.addEventListener('click', function(e) {
            if (e.target === this) sluitWtModal();
        });

        function wtUpdateStatus(state, text) {
            const states = {
                online: { class: 'online', text: 'Online' },
                offline: { class: 'offline', text: 'Offline' },
                connecting: { class: 'connecting', text: 'Verbinden...' },
                speaking: { class: 'speaking', text: 'Spreekt...' }
            };
            const s = states[state] || states.offline;
            wtStatusLed.className = 'wt-status-led ' + s.class;
            wtStatusText.textContent = text || s.text;
        }

        function wtAddChat(sender, text, isSystem = false) {
            const time = new Date().toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
            const div = document.createElement('div');
            div.className = 'msg';
            if (isSystem) { div.style.color = '#8899aa'; div.style.fontStyle = 'italic'; }
            div.innerHTML = `<span class="sender">${sender}</span> ${text} <span class="time">${time}</span>`;
            wtChatMessages.appendChild(div);
            wtChatMessages.scrollTop = wtChatMessages.scrollHeight;
        }

        function wtUpdateUserList() {
            const count = remoteStreams.size;
            wtUserCount.textContent = `👥 ${count}`;
            if (count === 0) {
                wtUserList.innerHTML = '<span style="color:#667788;font-size:12px;">Geen gebruikers</span>';
                wtBadge.textContent = '0';
                return;
            }
            let html = '';
            const roleEmoji = { leider:'👑', deelnemer:'👤' };
            html += `<div class="wt-user-chip self">
                <span>${isLeider ? '👑' : '👤'}</span> ${huidigeGebruiker} (jij)
                ${isSpeaking ? '🔊' : ''}
            </div>`;
            remoteStreams.forEach((_, pid) => {
                html += `<div class="wt-user-chip"><span>👤</span> ${pid.substring(0,12)}...</div>`;
            });
            wtUserList.innerHTML = html;
            wtBadge.textContent = count;
        }

        function wtSendChat(text) {
            if (!isConnected) return;
            const data = { type:'chat', sender:huidigeGebruiker, text, timestamp:Date.now() };
            connections.forEach(c => { try { c.send(data); } catch(e) {} });
            wtAddChat(`📤 ${huidigeGebruiker}`, text);
        }

        function wtHandleData(conn, data) {
            if (data.type === 'hello') {
                wtAddChat(`👋 ${data.username}`, `verbonden`, true);
                conn.send({ type:'hello_ack', username:huidigeGebruiker });
                wtUpdateUserList();
            }
            if (data.type === 'hello_ack') {
                wtAddChat(`👋 ${data.username}`, `bevestigd`, true);
                wtUpdateUserList();
            }
            if (data.type === 'chat') {
                wtAddChat(`💬 ${data.sender}`, data.text);
                if (isLeider) {
                    connections.forEach(c => {
                        if (c !== conn) { try { c.send(data); } catch(e) {} }
                    });
                }
            }
        }

        function wtStartSpeaking() {
            if (isSpeaking) return;
            if (!isConnected) { wtAddChat('⚠️ Systeem','Niet verbonden!',true); return; }
            if (connections.length === 0 && !isLeider) {
                wtAddChat('⚠️ Systeem','Niemand verbonden!',true); return;
            }
            isSpeaking = true;
            pttButton.classList.add('active');
            pttButton.textContent = '🎤 SPREEKT...';
            wtUpdateStatus('speaking', 'Spreekt...');
            if (localStream) {
                localStream.getAudioTracks().forEach(t => t.enabled = true);
            }
        }

        function wtStopSpeaking() {
            if (!isSpeaking) return;
            isSpeaking = false;
            pttButton.classList.remove('active');
            pttButton.textContent = '🎤 HOU IN';
            wtUpdateStatus('online', 'Online');
            if (localStream) {
                localStream.getAudioTracks().forEach(t => t.enabled = false);
            }
        }

        async function initWalkieTalkie() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks().forEach(t => t.enabled = false);
            } catch (err) {
                wtAddChat('❌ Fout', 'Geen microfoon: ' + err.message, true);
                pttButton.disabled = true;
                wtChatInput.disabled = true;
                wtChatSendBtn.disabled = true;
                return;
            }

            const peerId = isLeider ? WT_HUB_ID : `WALK_${huidigeGebruiker}`;
            wtPeerId.textContent = `ID: ${peerId}`;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                isConnected = true;
                wtUpdateStatus('online', 'Online');
                wtAddChat('📻 Systeem', `Verbonden als ${id}`, true);
                pttButton.disabled = false;
                wtChatInput.disabled = false;
                wtChatSendBtn.disabled = false;

                if (!isLeider) {
                    const conn = peer.connect(WT_HUB_ID);
                    setupDataConnection(conn);
                    const call = peer.call(WT_HUB_ID, localStream);
                    call.on('stream', (remoteStream) => {
                        remoteStreams.set(WT_HUB_ID, remoteStream);
                        wtPlayRemote(remoteStream);
                        wtUpdateUserList();
                        wtAddChat('📞 Audio', `Verbonden met ${WT_HUB_ID}`, true);
                    });
                    call.on('close', () => {
                        remoteStreams.delete(WT_HUB_ID);
                        wtUpdateUserList();
                        wtAddChat('📞 Audio', `Verbinding met ${WT_HUB_ID} verbroken`, true);
                    });
                }

                peer.on('connection', (conn) => { setupDataConnection(conn); });
                peer.on('call', (call) => {
                    if (isLeider) {
                        call.answer(localStream);
                        call.on('stream', (remoteStream) => {
                            remoteStreams.set(call.peer, remoteStream);
                            wtPlayRemote(remoteStream);
                            wtUpdateUserList();
                            wtAddChat(`📞 Audio`, `Verbonden met ${call.peer}`, true);
                        });
                        call.on('close', () => {
                            remoteStreams.delete(call.peer);
                            wtUpdateUserList();
                            wtAddChat(`📞 Audio`, `Verbinding met ${call.peer} verbroken`, true);
                        });
                    } else {
                        call.answer();
                    }
                });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.message.includes('ID taken')) {
                    wtAddChat('❌ Fout', `ID "${peerId}" is al in gebruik!`, true);
                    wtUpdateStatus('offline', 'ID conflict');
                    pttButton.disabled = true;
                    wtChatInput.disabled = true;
                    wtChatSendBtn.disabled = true;
                } else {
                    wtAddChat('❌ Fout', err.message, true);
                }
            });

            peer.on('disconnected', () => {
                isConnected = false;
                wtUpdateStatus('offline', 'Verbinding verbroken');
                pttButton.disabled = true;
                wtChatInput.disabled = true;
                wtChatSendBtn.disabled = true;
                wtAddChat('📻 Systeem', 'Verbinding verbroken.', true);
                setTimeout(() => { if (peer) peer.reconnect(); }, 3000);
            });
        }

        function setupDataConnection(conn) {
            conn.on('open', () => {
                if (!connections.some(c => c.peer === conn.peer)) {
                    connections.push(conn);
                    wtUpdateUserList();
                    wtAddChat('🔗 Systeem', `Verbonden met ${conn.peer}`, true);
                    conn.send({
                        type: 'hello',
                        username: huidigeGebruiker,
                        timestamp: Date.now()
                    });
                }
            });
            conn.on('data', (data) => { wtHandleData(conn, data); });
            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                remoteStreams.delete(conn.peer);
                wtUpdateUserList();
                wtAddChat('🔌 Systeem', `Verbinding met ${conn.peer} verbroken`, true);
            });
        }

        function wtPlayRemote(stream) {
            let audio = document.getElementById('remote-audio');
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'remote-audio';
                audio.autoplay = true;
                document.body.appendChild(audio);
            }
            audio.srcObject = stream;
            audio.play().catch(() => {});
        }

        function wtDisconnect() {
            if (peer) { peer.destroy(); peer = null; }
            connections = [];
            remoteStreams.clear();
            isConnected = false;
            pttButton.disabled = true;
            wtChatInput.disabled = true;
            wtChatSendBtn.disabled = true;
            wtUpdateStatus('offline', 'Verbinding verbroken');
            wtAddChat('🚪 Systeem', 'Verbinding verbroken.', true);
            sluitWtModal();
        }

        // ----- Event listeners walkie -----
        pttButton.addEventListener('mousedown', wtStartSpeaking);
        pttButton.addEventListener('mouseup', wtStopSpeaking);
        pttButton.addEventListener('mouseleave', wtStopSpeaking);
        pttButton.addEventListener('touchstart', (e) => { e.preventDefault(); wtStartSpeaking(); });
        pttButton.addEventListener('touchend', (e) => { e.preventDefault(); wtStopSpeaking(); });
        pttButton.addEventListener('touchcancel', (e) => { e.preventDefault(); wtStopSpeaking(); });

        wtChatSendBtn.addEventListener('click', () => {
            const txt = wtChatInput.value.trim();
            if (!txt) return;
            wtSendChat(txt);
            wtChatInput.value = '';
        });
        wtChatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') wtChatSendBtn.click(); });

        wtDisconnectBtn.addEventListener('click', () => {
            if (confirm('Verbinding verbreken?')) {
                wtDisconnect();
            }
        });

        // ============================================================
        // START
        // ============================================================
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('coordPanel').style.display = 'none';
        document.getElementById('legende').style.display = 'none';
        document.getElementById('locateBtn').style.display = 'none';
        document.getElementById('wtToggleBtn').style.display = 'none';
    </script>
</body>
</html>

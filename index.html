<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Live Kaart met MTB Trails</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #121212;
    }

    /* --- OPLICHTENDE BLAUWE MARKER --- */
    .blue-marker-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glowing-blue-marker {
      width: 14px;
      height: 14px;
      background-color: #00d2ff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7), 0 0 10px #00d2ff;
      }
      70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 15px rgba(0, 210, 255, 0), 0 0 20px #00d2ff;
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 210, 255, 0), 0 0 10px #00d2ff;
      }
    }

    /* --- NAAMLABEL (TOOLTIP) --- */
    .leaflet-tooltip.name-tag {
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid #00d2ff;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      border-radius: 4px;
      padding: 2px 6px;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
    }

    .leaflet-tooltip-top.name-tag::before {
      border-top-color: #00d2ff;
    }

    /* Vloeiende beweging bij positieverandering */
    .leaflet-marker-icon {
      transition: all 0.8s linear;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -----------------------------------------------------------
    // 1. FIREBASE CONFIGURATIE (Vul je eigen gegevens in)
    // -----------------------------------------------------------
    const firebaseConfig = {
      apiKey: "JOUW_API_KEY",
      authDomain: "JOUW_PROJECT.firebaseapp.com",
      databaseURL: "https://JOUW_PROJECT-default-rtdb.firebaseio.com",
      projectId: "JOUW_PROJECT",
      storageBucket: "JOUW_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "JOUW_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Speler ID en naam instellen
    const playerId = "player_" + Math.floor(Math.random() * 1000);
    const playerName = prompt("Voer je spelersnaam in:") || "Agent " + playerId.slice(-3);

    // -----------------------------------------------------------
    // 2. KAART & LAGEN INITIALISEREN
    // -----------------------------------------------------------
    const map = L.map('map').setView([52.3676, 4.9041], 14);

    // A. Basiskaart (Donkere modus voor een strak neon-effect)
    const darkTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // B. MTB-overlay laag (Waymarked Trails - toont wereldwijd officiële mountainbikeroutes)
    const mtbTrailsLayer = L.tileLayer('https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png', {
      maxZoom: 18,
      opacity: 0.8,
      attribution: '&copy; <a href="https://mtb.waymarkedtrails.org/">Waymarked Trails</a>'
    }).addTo(map);

    // Optioneel: Lagen-schakelaar rechtsboven op de kaart
    L.control.layers({ "Donkere Kaart": darkTileLayer }, { "MTB Trails Overlay": mtbTrailsLayer }).addTo(map);

    // -----------------------------------------------------------
    // 3. EIGEN GEOJSON MTB TRAILS INLADEN (OPTIONEEL)
    // -----------------------------------------------------------
    // Als je een specifiek eigen .geojson routebestand hebt, kun je dat hier laden:
    /*
    fetch('jouw-mtb-route.geojson')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#ff6b00', // Opvallend oranje
            weight: 4,
            dashArray: '6, 8', // Gestreepte spoorlijn
            opacity: 0.9
          }
        }).addTo(map);
      });
    */

    // -----------------------------------------------------------
    // 4. MARKERS & SPELERS LOGICA
    // -----------------------------------------------------------
    const glowingBlueIcon = L.divIcon({
      className: 'blue-marker-container',
      html: '<div class="glowing-blue-marker"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    const activeMarkers = {};

    // -----------------------------------------------------------
    // 5. GPS TRACKING VAN DE HUIDIGE SPELER
    // -----------------------------------------------------------
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          // Eigen locatie verzenden naar Firebase
          db.ref('locations/' + playerId).set({
            name: playerName,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
          });
        },
        (error) => console.error("GPS Fout:", error),
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 5000
        }
      );
    } else {
      alert("Geolocatie wordt niet ondersteund door deze browser.");
    }

    // -----------------------------------------------------------
    // 6. REAL-TIME FIREBASE SYNCHRONISATIE
    // -----------------------------------------------------------
    db.ref('locations').on('value', (snapshot) => {
      const players = snapshot.val();
      if (!players) return;

      Object.keys(players).forEach((id) => {
        const p = players[id];
        
        if (activeMarkers[id]) {
          // Positie en tooltip van bestaande speler bijwerken
          activeMarkers[id].setLatLng([p.lat, p.lng]);
          activeMarkers[id].setTooltipContent(p.name);
        } else {
          // Nieuwe oplichtende blauwe marker plaatsen met enkel het naamlabel
          const marker = L.marker([p.lat, p.lng], { icon: glowingBlueIcon })
            .addTo(map)
            .bindTooltip(p.name, {
              permanent: true,
              direction: 'top',
              offset: [0, -10],
              className: 'name-tag'
            });

          activeMarkers[id] = marker;
        }
      });
    });

    // Verwijder speler uit Firebase bij het sluiten van de pagina
    db.ref('locations/' + playerId).onDisconnect().remove();
  </script>

</body>
</html>

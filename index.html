<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amiens Groepsgids & Walkie</title>
    <!-- Leaflet voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PeerJS voor de groepswalkie -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background: #0f172a; color: #e2e8f0; overflow: hidden; }
        
        /* Linkerkant: Kaart */
        #map-container { flex: 2; position: relative; background: #1e293b; }
        #map { width: 100%; height: 100%; }
        .leaflet-popup-content { font-size: 14px; line-height: 1.5; max-width: 300px; color: #0f172a; }
        .leaflet-popup-content h3 { margin-top: 0; color: #b91c1c; }
        .leaflet-popup-content strong { color: #1d4ed8; }

        /* Rechterkant: Walkie Talkie Groep */
        #wt-container { flex: 1; min-width: 350px; padding: 20px; background: #1e293b; display: flex; flex-direction: column; border-left: 2px solid #334155; overflow-y: auto; }
        #wt-container h2 { color: #38bdf8; margin-bottom: 10px; font-size: 20px; }
        
        .id-box { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 15px; word-break: break-all; font-family: monospace; font-size: 13px; }
        
        .group-inputs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .group-inputs input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 100%; }
        .group-inputs input:focus { outline: 2px solid #38bdf8; }

        #connectBtn { padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        #connectBtn:hover { background: #60d5ff; }
        #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* PTT Knop */
        #pttBtn { width: 100%; padding: 20px; font-size: 22px; background: #ef4444; border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; margin: 10px 0; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); transition: 0.1s; }
        #pttBtn:active { background: #b91c1c; transform: scale(0.96); }
        #pttBtn:disabled { background: #475569; box-shadow: none; }

        /* Chat */
        .chat-area { flex: 1; background: #0f172a; border-radius: 6px; padding: 10px; overflow-y: auto; border: 1px solid #334155; margin: 10px 0; min-height: 100px; max-height: 300px; }
        .chat-area .msg { margin: 4px 0; font-size: 14px; }
        .chat-area .sys { color: #fbbf24; font-style: italic; }
        .chat-area .me { color: #4ade80; }
        .chat-area .other { color: #93c5fd; }

        .chat-input { display: flex; gap: 10px; margin-top: 5px; }
        .chat-input input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .chat-input button { padding: 8px 16px; background: #4ade80; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .chat-input button:disabled { opacity: 0.5; }

        .status { font-size: 13px; color: #94a3b8; margin-top: 8px; text-align: center; }
        .connected-count { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Linkerkant: Kaart -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Rechterkant: Walkie Groep -->
    <div id="wt-container">
        <h2>📻 Groepswalkie (4 pers.)</h2>
        
        <div>🔑 <strong>Jouw unieke code:</strong></div>
        <div id="myIdDisplay" class="id-box">Bezig met laden...</div>

        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">Voeg de codes van de andere 3 groepsleden toe:</div>
        <div class="group-inputs">
            <input type="text" id="remoteId1" placeholder="Code persoon 2">
            <input type="text" id="remoteId2" placeholder="Code persoon 3">
            <input type="text" id="remoteId3" placeholder="Code persoon 4">
        </div>
        <button id="connectBtn">🔗 Verbinden met de groep (start mesh)</button>

        <button id="pttBtn" disabled>🎙️ INGEDRUKT HOUDEN OM TE PRATEN</button>

        <div class="chat-area" id="chatArea">
            <div class="msg sys">📡 Start: wacht tot je verbonden bent met de groep...</div>
        </div>

        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Typ een groepsbericht..." disabled>
            <button id="sendBtn" disabled>📨 Stuur</button>
        </div>
        <div class="status" id="statusText">⏳ Genereer ID...</div>
    </div>

    <script>
        // --- 1. KAART (LEAFLET) ---
        const map = L.map('map').setView([49.8940, 2.3022], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // Marker met popup (tekst over crypte & labyrint)
        const marker = L.marker([49.8940, 2.3022]).addTo(map);
        marker.bindPopup(`
            <div style="max-width:280px;">
                <h3>🏛️ Notre Dame van Amiens</h3>
                <p><strong>Adres:</strong> 30 Place Notre Dame, 80000 Amiens</p>
                <hr>
                <h4>Over de crypte:</h4>
                <p>Ja, die is te bezoeken, maar <strong>niet vrij toegankelijk</strong>. De Romaanse crypte (11e eeuw) ligt onder het koor en is het enige restant van de vorige kathedraal. Je kunt hem alleen bezichtigen via een <strong>rondleiding</strong> (meestal georganiseerd door het Office de Tourisme).<br>
                <em>Let op:</em> Check ter plekke de actuele tijden – vaak alleen open in de zomermaanden. De ingang is via de zuidzijde van het koor.</p>
                
                <h4>🔎 Het bijzondere plekje:</h4>
                <p>Zonder twijfel <strong>het labyrint op de vloer van het schip</strong> (midden in de kerk, vlakbij de ingang). Dit zwart-wit marmeren doolhof symboliseert de pelgrimstocht naar het Hemelse Jeruzalem en toont de wiskundige precisie van de 13e-eeuwse bouwmeesters.</p>
                <p><em>Tip:</em> Het ligt vaak onder de stoelen, maar de kerkwachten kunnen ze voor je wegschuiven als je beleefd vraagt.</p>
            </div>
        `);
        marker.openPopup();

        // --- 2. GROEPSWALKIE (PEERJS MESH) ---
        let peer = null;
        let localStream = null;
        const connections = new Map(); // peerId -> DataConnection
        const audioElements = new Map(); // peerId -> Audio element
        let connectedPeers = new Set(); // om dubbele verbindingen te voorkomen

        const myIdDisplay = document.getElementById('myIdDisplay');
        const remoteId1 = document.getElementById('remoteId1');
        const remoteId2 = document.getElementById('remoteId2');
        const remoteId3 = document.getElementById('remoteId3');
        const connectBtn = document.getElementById('connectBtn');
        const pttBtn = document.getElementById('pttBtn');
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');

        function addChat(text, type = 'sys') {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function updateStatus(text) { statusText.textContent = text; }

        // Microfoon initialiseren (staat standaard UIT)
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false; // mute standaard
                updateStatus('✅ Microfoon gereed. Wacht op ID...');
            })
            .catch(err => {
                addChat(`❌ Geen microfoon toegang: ${err.message}`, 'sys');
                updateStatus('⚠️ Geen audio mogelijk zonder microfoon.');
            });

        // Peer initialiseren
        function initPeer() {
            peer = new Peer(null, {
                debug: 2,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myIdDisplay.textContent = id;
                updateStatus('✅ ID actief. Deel deze code met de groep (max 3 anderen).');
                addChat(`🔑 Jouw ID: ${id}`, 'sys');
            });

            // Inkomende data-verbinding (chat)
            peer.on('connection', (conn) => {
                const remoteId = conn.peer;
                if (connectedPeers.has(remoteId)) {
                    conn.close();
                    return;
                }
                connectedPeers.add(remoteId);
                connections.set(remoteId, conn);
                conn.on('data', (data) => addChat(`📨 Ander: ${data}`, 'other'));
                conn.on('open', () => {
                    addChat(`🔗 ${remoteId} heeft verbinding gemaakt`, 'sys');
                    updateConnectedCount();
                });
                conn.on('close', () => {
                    connectedPeers.delete(remoteId);
                    connections.delete(remoteId);
                    addChat(`🔌 ${remoteId} is verbroken`, 'sys');
                    updateConnectedCount();
                });
            });

            // Inkomende audio-oproep
            peer.on('call', (call) => {
                if (!localStream) {
                    call.close();
                    return;
                }
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                    audioElements.set(call.peer, audio);
                    addChat(`🎧 Audiostream van ${call.peer} actief`, 'sys');
                });
                call.on('close', () => {
                    audioElements.delete(call.peer);
                    addChat(`📴 Audio van ${call.peer} beëindigd`, 'sys');
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer.destroy();
                    peer = null;
                    initPeer();
                    return;
                }
                addChat(`⚠️ Fout: ${err.message}`, 'sys');
            });
        }
        initPeer();

        // Verbind met 3 anderen (mesh)
        connectBtn.onclick = () => {
            if (!localStream) {
                addChat('❌ Microfoon niet beschikbaar. Herlaad de pagina.', 'sys');
                return;
            }
            const ids = [remoteId1.value.trim(), remoteId2.value.trim(), remoteId3.value.trim()].filter(id => id !== '');
            if (ids.length === 0) {
                addChat('❌ Vul minstens 1 code in van een ander groepslid.', 'sys');
                return;
            }
            const myId = myIdDisplay.textContent;
            if (ids.includes(myId)) {
                addChat('❌ Je kunt niet met jezelf verbinden.', 'sys');
                return;
            }

            connectBtn.disabled = true;
            addChat(`⏳ Bezig met verbinden naar ${ids.length} groepsleden...`, 'sys');

            ids.forEach(remoteId => {
                if (connectedPeers.has(remoteId)) {
                    addChat(`ℹ️ Al verbonden met ${remoteId}`, 'sys');
                    return;
                }

                // Data connectie
                const conn = peer.connect(remoteId, { reliable: true });
                conn.on('open', () => {
                    connectedPeers.add(remoteId);
                    connections.set(remoteId, conn);
                    addChat(`🔗 Verbonden met ${remoteId}`, 'sys');
                    updateConnectedCount();
                });
                conn.on('data', (data) => addChat(`📨 Ander: ${data}`, 'other'));
                conn.on('close', () => {
                    connectedPeers.delete(remoteId);
                    connections.delete(remoteId);
                    addChat(`🔌 Verbinding met ${remoteId} verbroken`, 'sys');
                    updateConnectedCount();
                });

                // Audio oproep
                const call = peer.call(remoteId, localStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                    audioElements.set(remoteId, audio);
                    addChat(`🎧 Audio met ${remoteId} actief`, 'sys');
                });
                call.on('close', () => {
                    audioElements.delete(remoteId);
                    addChat(`📴 Audio met ${remoteId} beëindigd`, 'sys');
                });
            });

            setTimeout(() => { connectBtn.disabled = false; }, 1000);
        };

        // Aantal verbindingen bijwerken
        function updateConnectedCount() {
            const count = connectedPeers.size;
            const enabled = count > 0;
            pttBtn.disabled = !enabled || !localStream;
            chatInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                updateStatus(`🟢 Verbonden met ${count} groepsleden (audio klaar)`);
                pttBtn.style.background = '#ef4444';
            } else {
                updateStatus('⛔ Nog geen verbindingen');
                pttBtn.style.background = '#475569';
            }
        }

        // Push-to-talk (groepsaudio)
        pttBtn.addEventListener('mousedown', () => {
            if (!localStream || connectedPeers.size === 0) return;
            localStream.getAudioTracks()[0].enabled = true;
            pttBtn.textContent = '🔴 AAN HET PRATEN...';
        });
        pttBtn.addEventListener('mouseup', () => {
            if (localStream) localStream.getAudioTracks()[0].enabled = false;
            pttBtn.textContent = '🎙️ INGEDRUKT HOUDEN OM TE PRATEN';
        });
        pttBtn.addEventListener('mouseleave', () => {
            if (localStream) localStream.getAudioTracks()[0].enabled = false;
            pttBtn.textContent = '🎙️ INGEDRUKT HOUDEN OM TE PRATEN';
        });

        // Groepsbericht versturen
        sendBtn.onclick = () => {
            const msg = chatInput.value.trim();
            if (!msg || connectedPeers.size === 0) return;
            connections.forEach((conn) => conn.send(msg));
            addChat(`👤 Jij: ${msg}`, 'me');
            chatInput.value = '';
        };
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
